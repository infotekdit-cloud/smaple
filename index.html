<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV Budget Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        margin: 0;
    }

    .container {
        max-width: 500px;
        margin: 50px auto;
        background: #1e293b;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #38bdf8;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    select, input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: none;
        font-size: 14px;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background: #38bdf8;
        border: none;
        color: black;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #0ea5e9;
    }

    .result {
        margin-top: 20px;
        padding: 15px;
        background: #020617;
        border-radius: 6px;
        text-align: center;
        font-size: 18px;
        color: #22c55e;
    }
</style>

</head>
<body>

<div class="container">
    <h1>CCTV Budget Calculator</h1>

    <label>Camera Type</label>
    <select id="cameraType" onchange="updateBrands()">
        <option value="">Select Type</option>
        <option value="ip">IP Camera</option>
        <option value="hd">HD Camera</option>
        <option value="wifi">WiFi Camera</option>
        <option value="4g">4G/5G Camera</option>
    </select>

    <label>Brand</label>
    <select id="brand">
        <option>Select Brand</option>
    </select>

    <label>Number of Cameras</label>
    <input type="number" id="qty" placeholder="Enter quantity">

    <button onclick="calculate()">Calculate Budget</button>

    <div class="result" id="result">Total: ₹0</div>
</div>

<script>
function updateBrands() {
    const type = document.getElementById("cameraType").value;
    const brand = document.getElementById("brand");

    brand.innerHTML = "";

    let brandsList = [];

    if (type === "ip" || type === "hd") {
        brandsList = ["CP PLUS", "DAHUA", "HIKVISION", "KHIHVISION"];
    } else if (type === "wifi") {
        brandsList = ["CP PLUS", "HIKVISION"];
    } else if (type === "4g") {
        brandsList = ["HIKVISION", "DAHUA"];
    }

    brandsList.forEach(b => {
        let option = document.createElement("option");
        option.text = b;
        option.value = b;
        brand.add(option);
    });
}

function calculate() {
    const type = document.getElementById("cameraType").value;
    const qty = document.getElementById("qty").value;

    if (!type || !qty) {
        alert("Please select all fields");
        return;
    }

    let pricePerCamera = 0;

    if (type === "ip") pricePerCamera = 3000;
    if (type === "hd") pricePerCamera = 1500;
    if (type === "wifi") pricePerCamera = 2500;
    if (type === "4g") pricePerCamera = 4000;

    let total = pricePerCamera * qty;

    document.getElementById("result").innerText = "Total: ₹" + total;
}
</script>

</body>
</html>
