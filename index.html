<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kavitech CCTV Calculator</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
}

h1 { text-align:center; color:#38bdf8; }

input, select {
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
    border:none;
}

button {
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    background:#38bdf8;
    font-weight:bold;
    cursor:pointer;
}

.result {
    margin-top:15px;
    padding:10px;
    background:black;
    text-align:center;
    border-radius:6px;
}

/* QR */
.qr-box {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 150px;
    background: white;
    padding: 10px;
    border-radius: 10px;
}

.qr-box img { width:100%; }

</style>
</head>

<body>

<div class="container">
<h1>Kavitech CCTV Calculator</h1>

<input type="text" id="name" placeholder="Customer Name">
<input type="tel" id="phone" placeholder="WhatsApp Number">

<select id="cameraType" onchange="updateBrands()">
<option value="">Camera Type</option>
<option value="IP Camera">IP Camera</option>
<option value="HD Camera">HD Camera</option>
<option value="WiFi Camera">WiFi Camera</option>
<option value="4G Camera">4G/5G Camera</option>
</select>

<select id="brand"></select>

<input type="number" id="qty" placeholder="No. of Cameras">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result">Total: ₹0</div>

<button onclick="sendWhatsApp()">Send Invoice via WhatsApp</button>

</div>

<div class="qr-box">
<img id="qrImage">
<button onclick="payNow()">Pay</button>
</div>

<script>
const upiID = "infotek.dit@okicici";
const businessName = "Kavitech";

// Brand logic
function updateBrands() {
    const type = document.getElementById("cameraType").value;
    const brand = document.getElementById("brand");
    brand.innerHTML = "";

    let list = ["CP PLUS","DAHUA","HIKVISION","KHIHVISION"];
    list.forEach(b=>{
        let opt=document.createElement("option");
        opt.text=b;
        brand.add(opt);
    });
}

// Generate UPI
function generateUPI(amount) {
    const link = `upi://pay?pa=${upiID}&pn=${businessName}&am=${amount}&cu=INR`;
    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(link)}`;

    document.getElementById("qrImage").src = qr;
    window.upiLink = link;
}

// Calculate
function calculate() {
    const type = document.getElementById("cameraType").value;
    const qty = document.getElementById("qty").value;

    let price = 0;
    if(type==="IP Camera") price=3000;
    if(type==="HD Camera") price=1500;
    if(type==="WiFi Camera") price=2500;
    if(type==="4G Camera") price=4000;

    let total = price * qty;

    document.getElementById("result").innerText = "Total: ₹"+total;

    window.totalAmount = total;

    generateUPI(total);
}

// Pay
function payNow() {
    if(!window.upiLink){
        alert("Calculate first");
        return;
    }
    window.location.href = window.upiLink;
}

// WhatsApp Invoice
function sendWhatsApp() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const type = document.getElementById("cameraType").value;
    const brand = document.getElementById("brand").value;
    const qty = document.getElementById("qty").value;
    const total = window.totalAmount;

    if(!name || !phone || !total){
        alert("Fill all details & calculate");
        return;
    }

    const message =
`Hello ${name},

*KAVITECH CCTV QUOTATION*

Camera Type: ${type}
Brand: ${brand}
Quantity: ${qty}

Total Amount: ₹${total}

Payment Link:
${window.upiLink}

Thank you!`;

    const url = `https://wa.me/91${phone}?text=${encodeURIComponent(message)}`;

    window.open(url, "_blank");
}
</script>

</body>
</html>
